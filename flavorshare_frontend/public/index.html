<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- PUBLIC_INTERFACE -->
    <!-- Basic CRA-compatible index.html with a visible title and meta tags -->
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="FlavorShare Frontend - Lightweight React Template"
    />
    <title>FlavorShare Frontend</title>
    <style>
      /* Ensure body background is visible even before React mounts */
      html, body, #root { height: 100%; }
      body { margin: 0; background: #f9fafb; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
